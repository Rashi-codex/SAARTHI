<!DOCTYPE html>
<html>
<head>
<title>Update user</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<h2>Update user</h2>
    <style>
        .card-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            width: 300px;
        }
        label {
            margin-top: 10px;
        }
        input {
            padding: 8px;
            margin-top: 5px;
        }
        button {
            margin-top: 15px;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;

        }
           
    </style>
</head>
<body>
    <div class="card-container">
        <h1>Update User Information </h1>
        <form  action="{{ url_for('update_user_route', email=user[0]) }}" method="POST">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ user[0] }}" readonly><br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" value="{{ user[1] }}" required><br><br>
            <label for="role">Role:</label>
            <input type="text" id="role" name="role" value="{{ user[2] }}" required><br><br>
            <label for="age_group">Age Group:</label>
            <input type="text" id="age_group" name="age_group" value="{{ user[3] }}" required><br><br>
            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" value="{{ user[4] }}" required><br><br>
            <button type="submit">Update User</button>
        </form>
        <button class="bg-white text-center w-48 rounded-2xl h-14 relative text-black text-xl font-semibold group"
        type="button"
        >
        <div class="bg-green-400 rounded-xl h-12 w-1/4 flex items-center justify-center absolute left-1 top-[4px] group-hover:w-[184px] z-10 duration-500"
        >
        <svg xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 1024 1024"
        height="25px"
        width="25px"
        >
        <path
        d="M224 480h640a32 32 0 1 1 0 64H224a32 32 0 0 1 0-64z"
        fill="#000000"
        ></path>
        <path
            d="m237.248 512 265.408 265.344a32 32 0 0 1-45.312 45.312l-288-288a32 32 0 0 1 0-45.312l288-288a32 32 0 1 1 45.312 45.312L237.248 512z"
            fill="#000000"
        ></path>
        </svg>
        </div>
        </button>
        <a href="javascript:history.back()">Go Back</a> 

  </div>



</body>
</html>
