<!DOCTYPE html>
<html>
<head>
<title>LOGIN </title>

<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            overflow: auto;
            height: 100vh;
            background: black;
        }

        /* Canvas for 3D universe */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
  
        }
    </style>
</head>
<body>
<center>
<h1>SAARTHI</h1>
<div align="center">
<form method="post" action="/dashboard">
Email:<input type="email" name="email"><br><br>
Password:<input type="password" name="password"><br><br>
First name:<input type="text" name="First_name"><br><br>
Last name:<input type="text" name="Last_name"><br><br>
<p><strong>Role:</strong></p>
<label class="radio-group"> 
    <input type="radio"name="role" value="Children">Children
</label>
<label class="radio-group">
    <input type="radio"name="role" value="Student">Student
</label>
<label class="radio-group">
    <input type="radio"name="role" value="Senior">Senior
</label>
<p><strong>Age_group:</strong></p>
<label class="radio-group">
    <input type="radio"name="age_group" value ="5-12">5-12
</label>
<label class="radio-group">
    <input type="radio"name="age_group" value ="13-24">13-24
</label><br>
<label class="radio-group">
    <input type="radio"name="age_group" value ="Above 35">Above 35
</label><br>

<button type="submit">Login</button>
</form>
<style>
    form {
        display: flex;
        flex-direction: column;
        margin-top: 20px;
        align-items: center;
        color: white;
        padding: 20px;
    }
    input {
        margin: 5px;
        padding: 8px;
        width: 200px;
    }
    button {
        margin-top: 15px;
        padding: 10px 20px;
        background-color: #4CAF50;
        color: rgb(255, 255, 255);
        border: none;
        cursor: pointer;
    }
    button:hover {
        background-color: #45a049;
    }
    h1{
        color:white;
        padding: 20px;
        text-align: center;
        margin-top: 20px;
    }
    h2{
        color:white;
        padding: 20px;
        text-align: center;
        margin-top: 20px;
    }
    .user-list{
        list-style-type:none;
        padding: 20px;
        margin:0;
    }
    .user-list li{
        margin:10px 0;
        padding:10px;
        border:1px solid #ccc;
        border-radius:5px;
        display:flex;
        justify-content:space-between;
        align-items:center;
        color:white;
    }
    .user-list li a{
        margin-left:10px;
        text-decoration:none;
        color:white;
    }
    .user-list li a:hover{
        color:white;
        border-radius: 5px;
    }   
    .delete-link{
        color:#00f2ffe4;
    }
    .delete-link:hover{
        text-decoration:underline;
        border-radius: 5px;
    }


</style>
<div class="card-container">
    <h1>User management</h1>
    <h2>Add New user </h2>
    <form action="/add_user" method="POST">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <input type="text" name="role" placeholder="Role" required>
        <input type="text" name="age_group" placeholder="Age Group" required>
        <input type="text" name="subject" placeholder="Subject" required>
        <button type="submit">Add User</button>
    </form>
</div>
<h2>Users List</h2>
<ul class="user-list">
    {% for user in users %}
        <li>
            <span>{{ user[0] }} (password:{{user[1]}}) (role:{{user[2]}}) (age_group:{{user[3]}}) (subject:{{user[4]}})</span> |
    
        
            <div>
                <a href="{{url_for('update_user_route', email=user[0])}}" class="Edit">Edit</a>
                <a href="{{url_for('delete_user_route', email=user[0])}}"class="Delete">Delete</a>
            </div>
        </li>
    {% endfor %}
    </ul>

</div>

</center>

</body>
</html>
